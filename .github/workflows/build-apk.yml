name: Build JAM AI Android APK & Google Play Bundle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant Execute Permission to Gradlew
      working-directory: ./android
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK & Release APK & Play Store Bundle (AAB)
      working-directory: ./android
      run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

    - name: Upload Debug APK (Direct Install on Phones)
      uses: actions/upload-artifact@v4
      with:
        name: jam-ai-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: jam-ai-release-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30

    - name: Upload Google Play Store Bundle (.AAB)
      uses: actions/upload-artifact@v4
      with:
        name: jam-ai-playstore-aab
        path: android/app/build/outputs/bundle/release/*.aab
        retention-days: 30
