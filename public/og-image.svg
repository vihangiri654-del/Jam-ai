<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050714" />
      <stop offset="40%" stop-color="#0b0f29" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <linearGradient id="indigoViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="150" r="220" fill="#4f46e5" opacity="0.25" filter="url(#glow)" />
  <circle cx="1000" cy="480" r="260" fill="#8b5cf6" opacity="0.2" filter="url(#glow)" />
  <circle cx="950" cy="120" r="180" fill="#06b6d4" opacity="0.18" filter="url(#glow)" />

  <!-- Subtle Cyber Grid Lines -->
  <path d="M 0 100 L 1200 100 M 0 200 L 1200 200 M 0 300 L 1200 300 M 0 400 L 1200 400 M 0 500 L 1200 500" stroke="#1e293b" stroke-width="1" opacity="0.3" />
  <path d="M 200 0 L 200 630 M 400 0 L 400 630 M 600 0 L 600 630 M 800 0 L 800 630 M 1000 0 L 1000 630" stroke="#1e293b" stroke-width="1" opacity="0.3" />

  <!-- Top Badge / Creator Pill -->
  <rect x="80" y="60" width="370" height="42" rx="21" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1.5" />
  <circle cx="104" cy="81" r="6" fill="#10b981" />
  <text x="122" y="86" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1">OFFICIAL SUPER AI PLATFORM</text>

  <!-- Author Badge -->
  <rect x="860" y="60" width="260" height="42" rx="21" fill="rgba(15, 23, 42, 0.8)" stroke="#334155" stroke-width="1.5" />
  <text x="885" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Creator: <tspan fill="#38bdf8" font-weight="700">Vihaan Giri</tspan></text>

  <!-- Main Hero Logo & Heading -->
  <text x="80" y="195" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="-1.5">JAM AI <tspan fill="#818cf8">(जैम एआई)</tspan></text>

  <!-- Big Catchy Tagline -->
  <text x="82" y="246" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600">The World's Fastest Universal AI &amp; Pro Media Studio</text>
  
  <text x="82" y="280" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">Ultra-fast sub-second AI, Neural Voice, Pro Reel Video Edits, and Instant App Creation.</text>

  <!-- Feature Showcase Cards Grid (4 Pill Banners) -->
  <!-- Card 1: Neural Voice -->
  <g transform="translate(80, 325)">
    <rect width="245" height="135" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <rect x="18" y="18" width="38" height="38" rx="10" fill="rgba(99, 102, 241, 0.2)" />
    <text x="28" y="44" font-size="20">🎙️</text>
    <text x="68" y="43" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Neural Voice</text>
    <text x="18" y="82" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">ChatGPT &amp; Claude Grade</text>
    <text x="18" y="104" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Natural Indian Hindi &amp; English</text>
  </g>

  <!-- Card 2: Pro Video & Reel Editor -->
  <g transform="translate(345, 325)">
    <rect width="250" height="135" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <rect x="18" y="18" width="38" height="38" rx="10" fill="rgba(236, 72, 153, 0.2)" />
    <text x="28" y="44" font-size="20">🏎️</text>
    <text x="68" y="43" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Pro Reel Edits</text>
    <text x="18" y="82" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Multi-Cut BMW &amp; Meme Edits</text>
    <text x="18" y="104" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Speed Ramps, Emojis &amp; Beat Drops</text>
  </g>

  <!-- Card 3: Live App Studio -->
  <g transform="translate(615, 325)">
    <rect width="245" height="135" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <rect x="18" y="18" width="38" height="38" rx="10" fill="rgba(6, 182, 212, 0.2)" />
    <text x="28" y="44" font-size="20">💻</text>
    <text x="68" y="43" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">App Builder</text>
    <text x="18" y="82" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Full-Stack Live Sandbox</text>
    <text x="18" y="104" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Instant Code Gen &amp; Playable Games</text>
  </g>

  <!-- Card 4: Lightning Sub-Second Engine -->
  <g transform="translate(880, 325)">
    <rect width="240" height="135" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <rect x="18" y="18" width="38" height="38" rx="10" fill="rgba(16, 185, 129, 0.2)" />
    <text x="28" y="44" font-size="20">⚡</text>
    <text x="68" y="43" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Sub-1s Speed</text>
    <text x="18" y="82" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Instant Token Response</text>
    <text x="18" y="104" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Ultra-Smooth 120 FPS Experience</text>
  </g>

  <!-- Bottom Brand Footer Strip -->
  <g transform="translate(80, 500)">
    <rect width="1040" height="60" rx="14" fill="rgba(15, 23, 42, 0.7)" stroke="#1e293b" stroke-width="1" />
    <circle cx="32" cy="30" r="10" fill="#6366f1" />
    <text x="56" y="36" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Created by <tspan fill="#38bdf8" font-weight="700">Vihaan Giri</tspan> (vihangiri654@gmail.com)</text>
    <text x="680" y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Android APK • WebApp • Pro AI Studio</text>
  </g>
</svg>
